<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>습관 트래커</title>
  <style>
    :root {
      --bg: #f6f8fa;
      --card: #ffffff;
      --text: #1f2328;
      --muted: #656d76;
      --border: #d0d7de;
      --accent: #2da44e;
      --today: #dafbe1;
      --lv0: #ebedf0;
      --lv1: #9be9a8;
      --lv2: #40c463;
      --lv3: #30a14e;
      --lv4: #216e39;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 16px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    header h1 { font-size: 1.6rem; }
    header .today { color: var(--muted); font-size: 0.95rem; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .card h2 {
      font-size: 1.1rem;
      margin-bottom: 14px;
    }

    .empty {
      color: var(--muted);
      font-size: 0.9rem;
      padding: 8px 0;
    }

    /* 습관 추가 폼 */
    .add-form {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .add-form input[type="text"] {
      flex: 1;
      min-width: 180px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
    }

    .add-form input[type="color"] {
      width: 44px;
      height: 44px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2px;
      background: none;
      cursor: pointer;
    }

    button {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }

    button.ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 6px 12px;
      font-size: 0.85rem;
    }

    button.ghost.checked {
      border-color: var(--accent);
      color: var(--accent);
    }

    button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    /* 통계 */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .stat {
      text-align: center;
      padding: 16px 8px;
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .stat .value { font-size: 1.6rem; font-weight: 700; }
    .stat .label { color: var(--muted); font-size: 0.85rem; }

    /* 오늘 할 일 */
    .todo-list { list-style: none; }

    .todo-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 4px;
      border-top: 1px solid var(--border);
    }

    .todo-list li:first-child { border-top: none; }

    .todo-list input[type="checkbox"],
    .week-table input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .todo-list label { cursor: pointer; }

    .todo-list li.done label {
      color: var(--muted);
      text-decoration: line-through;
    }

    /* 주간 체크표 */
    .week-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .week-head h2 { margin-bottom: 0; }

    .week-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .week-wrap { overflow-x: auto; }

    .week-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    .week-table th,
    .week-table td {
      padding: 8px 6px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    .week-table th { color: var(--muted); font-weight: 500; }
    .week-table th small { display: block; font-size: 0.75rem; }

    .week-table td:first-child,
    .week-table th:first-child {
      text-align: left;
      font-weight: 600;
      color: var(--text);
    }

    .week-table .is-today { background: var(--today); }
    .week-table input:disabled { cursor: default; }
    .week-table .rate { color: var(--muted); }

    /* 습관 목록 */
    .habit {
      border-top: 1px solid var(--border);
      padding: 16px 0;
    }

    .habit:first-child { border-top: none; padding-top: 0; }

    .habit-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .habit-name {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .streak { color: var(--muted); font-size: 0.85rem; font-weight: 400; }

    .habit-actions { display: flex; gap: 6px; }

    /* 잔디 그리드: 열 = 주(월~일), 맨 오른쪽 열 = 이번 주 */
    .grass-wrap { overflow-x: auto; }

    .grass {
      display: grid;
      grid-template-rows: repeat(7, 12px);
      grid-auto-flow: column;
      grid-auto-columns: 12px;
      gap: 3px;
      width: max-content;
    }

    .cell {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 2px;
      background: var(--lv0);
    }

    .cell.lv1 { background: var(--lv1); }
    .cell.lv2 { background: var(--lv2); }
    .cell.lv3 { background: var(--lv3); }
    .cell.lv4 { background: var(--lv4); }
    .cell.future { background: transparent; }
    .cell.clickable { cursor: pointer; }
    .cell.clickable:hover { outline: 1px solid var(--muted); }

    .legend {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 12px;
    }

    @media (max-width: 520px) {
      .stats { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🌱 습관 트래커</h1>
      <span class="today" id="today-label"></span>
    </header>

    <!-- 습관 추가 -->
    <section class="card">
      <h2>새 습관 추가</h2>
      <form class="add-form" id="add-form">
        <input type="text" id="habit-name" placeholder="예: 물 2L 마시기" maxlength="40" autocomplete="off" />
        <input type="color" id="habit-color" value="#2da44e" title="습관 색상" />
        <button type="submit">추가</button>
      </form>
    </section>

    <!-- 통계 -->
    <section class="card">
      <h2>오늘의 현황</h2>
      <div class="stats">
        <div class="stat">
          <div class="value" id="stat-today">0 / 0</div>
          <div class="label">오늘 완료</div>
        </div>
        <div class="stat">
          <div class="value" id="stat-streak">0일</div>
          <div class="label">최장 연속 기록</div>
        </div>
        <div class="stat">
          <div class="value" id="stat-month">-</div>
          <div class="label">이번 달 달성률</div>
        </div>
      </div>
    </section>

    <!-- 오늘 할 일 -->
    <section class="card">
      <h2>오늘 할 일</h2>
      <ul class="todo-list" id="todo-list"></ul>
    </section>

    <!-- 주간 체크표 -->
    <section class="card">
      <div class="week-head">
        <h2>주간 체크표</h2>
        <div class="week-nav">
          <button class="ghost" id="week-prev" title="지난주">◀</button>
          <span id="week-range"></span>
          <button class="ghost" id="week-next" title="다음 주">▶</button>
        </div>
      </div>
      <div class="week-wrap">
        <table class="week-table" id="week-table"></table>
      </div>
    </section>

    <!-- 전체 기록 잔디: 그날 완료한 습관 비율로 진하기 결정 -->
    <section class="card">
      <h2>전체 기록 (최근 20주)</h2>
      <div class="grass-wrap"><div class="grass" id="overall-grass"></div></div>
      <div class="legend">
        0%
        <span class="cell"></span>
        <span class="cell lv1"></span>
        <span class="cell lv2"></span>
        <span class="cell lv3"></span>
        <span class="cell lv4"></span>
        100%
      </div>
    </section>

    <!-- 습관 목록: 습관별 잔디는 완료한 날을 습관 색으로 칠함 -->
    <section class="card">
      <h2>내 습관</h2>
      <div id="habit-list"></div>
    </section>

    <footer>데이터는 이 브라우저에만 저장됩니다.</footer>
  </div>

  <script>
    const STORAGE_KEY = 'habit-tracker-v1';
    const WEEKS = 20;
    const DAY_NAMES = ['일', '월', '화', '수', '목', '금', '토'];

    // 습관: { id, name, color, created: 'YYYY-MM-DD', done: { 'YYYY-MM-DD': true } }
    let state = load();
    let weekOffset = 0; // 0 = 이번 주, -1 = 지난주 ...

    // ---------- 저장 ----------
    function load() {
      try {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (data && Array.isArray(data.habits)) return data;
      } catch (e) {}
      return { habits: [] };
    }

    function save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    // ---------- 날짜 ----------
    // toISOString()은 UTC 기준이라 한국 시간 자정~오전 9시에 날짜가 하루 밀리므로 로컬 날짜로 직접 만든다
    function toKey(date) {
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${date.getFullYear()}-${m}-${d}`;
    }

    function fromKey(key) {
      const [y, m, d] = key.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    function addDays(date, n) {
      return new Date(date.getFullYear(), date.getMonth(), date.getDate() + n);
    }

    function today() {
      const now = new Date();
      return new Date(now.getFullYear(), now.getMonth(), now.getDate());
    }

    function mondayOf(date) {
      return addDays(date, -((date.getDay() + 6) % 7));
    }

    function dayDiff(fromKeyStr, toKeyStr) {
      return Math.round((fromKey(toKeyStr) - fromKey(fromKeyStr)) / 86400000);
    }

    // ---------- 계산 ----------
    // 오늘 아직 체크 안 했으면 어제까지의 연속 기록을 유지한다
    function currentStreak(habit) {
      let d = today();
      if (!habit.done[toKey(d)]) d = addDays(d, -1);
      let count = 0;
      while (habit.done[toKey(d)]) {
        count++;
        d = addDays(d, -1);
      }
      return count;
    }

    function longestStreak(habit) {
      const keys = Object.keys(habit.done).sort();
      let best = 0, run = 0, prev = null;
      for (const key of keys) {
        run = prev && dayDiff(prev, key) === 1 ? run + 1 : 1;
        best = Math.max(best, run);
        prev = key;
      }
      return best;
    }

    // 이번 달 1일(또는 습관을 처음 기록한 날)부터 오늘까지 완료 비율
    function monthRate() {
      const t = today();
      const todayKey = toKey(t);
      const monthStart = toKey(new Date(t.getFullYear(), t.getMonth(), 1));
      let total = 0, done = 0;
      for (const h of state.habits) {
        const firstDone = Object.keys(h.done).sort()[0];
        let start = firstDone && firstDone < h.created ? firstDone : h.created;
        if (start < monthStart) start = monthStart;
        if (start > todayKey) continue;
        for (let d = fromKey(start); toKey(d) <= todayKey; d = addDays(d, 1)) {
          total++;
          if (h.done[toKey(d)]) done++;
        }
      }
      return total ? Math.round((done / total) * 100) + '%' : '-';
    }

    function doneCountOn(key) {
      return state.habits.filter(h => h.done[key]).length;
    }

    // ---------- 조작 ----------
    function addHabit(name, color) {
      state.habits.push({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        name,
        color,
        created: toKey(today()),
        done: {},
      });
      save();
      render();
    }

    function deleteHabit(id) {
      state.habits = state.habits.filter(h => h.id !== id);
      save();
      render();
    }

    function toggle(id, key) {
      if (key > toKey(today())) return; // 미래 날짜는 체크 불가
      const habit = state.habits.find(h => h.id === id);
      if (!habit) return;
      if (habit.done[key]) delete habit.done[key];
      else habit.done[key] = true;
      save();
      render();
    }

    // ---------- 렌더링 ----------
    function esc(str) {
      return String(str).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]));
    }

    function render() {
      const t = today();
      const todayKey = toKey(t);
      const habits = state.habits;

      document.getElementById('today-label').textContent =
        `${t.getFullYear()}년 ${t.getMonth() + 1}월 ${t.getDate()}일 (${DAY_NAMES[t.getDay()]})`;

      // 통계
      document.getElementById('stat-today').textContent = `${doneCountOn(todayKey)} / ${habits.length}`;
      document.getElementById('stat-streak').textContent =
        `${Math.max(0, ...habits.map(longestStreak))}일`;
      document.getElementById('stat-month').textContent = monthRate();

      renderTodo(todayKey);
      renderWeek(t, todayKey);
      renderOverallGrass(t, todayKey);
      renderHabitList(t, todayKey);
    }

    function renderTodo(todayKey) {
      const list = document.getElementById('todo-list');
      if (!state.habits.length) {
        list.innerHTML = '<li class="empty">위에서 습관을 추가해 보세요.</li>';
        return;
      }
      list.innerHTML = state.habits.map(h => {
        const done = !!h.done[todayKey];
        return `
          <li class="${done ? 'done' : ''}">
            <input type="checkbox" id="todo-${h.id}" data-habit="${h.id}" data-date="${todayKey}"
              style="accent-color:${esc(h.color)}" ${done ? 'checked' : ''} />
            <label for="todo-${h.id}">${esc(h.name)}</label>
          </li>`;
      }).join('');
    }

    function renderWeek(t, todayKey) {
      const monday = addDays(mondayOf(t), weekOffset * 7);
      const days = Array.from({ length: 7 }, (_, i) => addDays(monday, i));
      const fmt = d => `${d.getMonth() + 1}월 ${d.getDate()}일`;

      document.getElementById('week-range').textContent = `${fmt(days[0])} ~ ${fmt(days[6])}`;
      document.getElementById('week-next').disabled = weekOffset >= 0;

      const table = document.getElementById('week-table');
      if (!state.habits.length) {
        table.innerHTML = '<tr><td class="empty">습관이 없습니다.</td></tr>';
        return;
      }

      const head = days.map(d => {
        const cls = toKey(d) === todayKey ? ' class="is-today"' : '';
        return `<th${cls}>${DAY_NAMES[d.getDay()]}<small>${d.getMonth() + 1}/${d.getDate()}</small></th>`;
      }).join('');

      const rows = state.habits.map(h => {
        let count = 0;
        const cells = days.map(d => {
          const key = toKey(d);
          const done = !!h.done[key];
          if (done) count++;
          const cls = key === todayKey ? ' class="is-today"' : '';
          return `<td${cls}><input type="checkbox" data-habit="${h.id}" data-date="${key}"
            style="accent-color:${esc(h.color)}" ${done ? 'checked' : ''} ${key > todayKey ? 'disabled' : ''} /></td>`;
        }).join('');
        return `<tr><td>${esc(h.name)}</td>${cells}<td class="rate">${count}/7</td></tr>`;
      }).join('');

      table.innerHTML = `<thead><tr><th>습관</th>${head}<th>달성</th></tr></thead><tbody>${rows}</tbody>`;
    }

    // 20주 × 7일 날짜 목록 (맨 오른쪽 열이 이번 주)
    function grassDays(t) {
      const start = addDays(mondayOf(t), -(WEEKS - 1) * 7);
      return Array.from({ length: WEEKS * 7 }, (_, i) => toKey(addDays(start, i)));
    }

    function renderOverallGrass(t, todayKey) {
      const total = state.habits.length;
      document.getElementById('overall-grass').innerHTML = grassDays(t).map(key => {
        if (key > todayKey) return '<div class="cell future"></div>';
        const done = doneCountOn(key);
        const ratio = total ? done / total : 0;
        const lv = ratio === 0 ? 0 : ratio <= 0.25 ? 1 : ratio <= 0.5 ? 2 : ratio <= 0.75 ? 3 : 4;
        return `<div class="cell${lv ? ' lv' + lv : ''}" title="${key} · ${done}/${total} 완료"></div>`;
      }).join('');
    }

    function renderHabitList(t, todayKey) {
      const list = document.getElementById('habit-list');
      if (!state.habits.length) {
        list.innerHTML = '<p class="empty">아직 등록된 습관이 없습니다.</p>';
        return;
      }
      const days = grassDays(t);
      list.innerHTML = state.habits.map(h => {
        const doneToday = !!h.done[todayKey];
        const cells = days.map(key => {
          if (key > todayKey) return '<div class="cell future"></div>';
          const done = !!h.done[key];
          const style = done ? ` style="background:${esc(h.color)}"` : '';
          return `<div class="cell clickable" data-habit="${h.id}" data-date="${key}"${style}
            title="${key} · ${done ? '완료' : '미완료'} (클릭해서 변경)"></div>`;
        }).join('');
        return `
          <div class="habit">
            <div class="habit-head">
              <div class="habit-name">
                <span class="dot" style="background:${esc(h.color)}"></span>
                ${esc(h.name)}
                <span class="streak">🔥 ${currentStreak(h)}일 연속</span>
              </div>
              <div class="habit-actions">
                <button class="ghost${doneToday ? ' checked' : ''}" data-today="${h.id}">
                  ${doneToday ? '오늘 완료 ✓' : '오늘 체크'}
                </button>
                <button class="ghost" data-delete="${h.id}">삭제</button>
              </div>
            </div>
            <div class="grass-wrap"><div class="grass">${cells}</div></div>
          </div>`;
      }).join('');
    }

    // ---------- 이벤트 ----------
    document.getElementById('add-form').addEventListener('submit', e => {
      e.preventDefault();
      const input = document.getElementById('habit-name');
      const name = input.value.trim();
      if (!name) {
        input.focus();
        return;
      }
      if (state.habits.some(h => h.name === name)) {
        alert('이미 같은 이름의 습관이 있습니다.');
        return;
      }
      addHabit(name, document.getElementById('habit-color').value);
      input.value = '';
      input.focus();
    });

    // 오늘 할 일 / 주간 체크표 체크박스
    document.addEventListener('change', e => {
      const el = e.target;
      if (el.matches('input[type="checkbox"][data-habit]')) toggle(el.dataset.habit, el.dataset.date);
    });

    document.addEventListener('click', e => {
      const cell = e.target.closest('.cell.clickable');
      if (cell) return toggle(cell.dataset.habit, cell.dataset.date);

      const todayBtn = e.target.closest('[data-today]');
      if (todayBtn) return toggle(todayBtn.dataset.today, toKey(today()));

      const delBtn = e.target.closest('[data-delete]');
      if (delBtn) {
        const habit = state.habits.find(h => h.id === delBtn.dataset.delete);
        if (habit && confirm(`'${habit.name}' 습관을 삭제할까요? 기록도 함께 사라집니다.`)) deleteHabit(habit.id);
      }
    });

    document.getElementById('week-prev').addEventListener('click', () => {
      weekOffset--;
      render();
    });

    document.getElementById('week-next').addEventListener('click', () => {
      if (weekOffset < 0) weekOffset++;
      render();
    });

    // 탭을 켜 둔 채 날짜가 바뀌어도 다시 볼 때 오늘 기준으로 갱신
    window.addEventListener('focus', render);

    render();
  </script>
</body>
</html>
